.sx-count{position:relative;border:1px solid #a9b8ff;color:#fff;cursor:pointer;font:inherit}
.sx-count i{font:700 13px ui-monospace,monospace;font-style:normal;color:#dfe5ff;margin-top:-2px}
.sx-bar{display:block;width:100%;height:4px;border-radius:3px;background:#ffffff33;margin-top:3px;overflow:hidden}.sx-bar>span{display:block;height:100%;background:#8af2c9;transition:width .3s}
.sx-hud.done .sx-count{background:#049a6e;border-color:#8af2c9}
.sx-hud.over .sx-count{background:#b46a00;border-color:#ffd27a}
.sx-hud-btns{display:grid;gap:4px;flex-shrink:0}
.sx-mini{min-width:54px}
.sx-mini.danger{background:#a3162dcc;border-color:#ffb3bf}
.camera.sx-ok{box-shadow:0 0 0 4px #2fe3a2,0 10px 26px #102b412a}
.sx-del{background:#3b1320f5;border-color:#ff9fb0}.sx-del .sx-primary{color:#7d1f30}
.sx-row{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 40px 34px}
.sx-x{width:30px;height:30px;border-radius:8px;border:1px solid #efc5cc;background:#fff4f5;color:#a62638;font-weight:800;padding:0}
.sx-col{grid-column:2/-1}
.sx-row.confirm{grid-template-columns:44px 1fr;background:#fff1f3}
.sx-confirm-text{font-size:12px}.sx-confirm-btns{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.sx-missed{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fdecef;border:2px solid #e78a9a;color:#7d1f30;font-size:12px;display:grid;gap:5px}
.sx-mrow{display:grid;grid-template-columns:1fr 1fr 44px 28px;gap:6px;align-items:center;background:#fff;border-radius:8px;padding:6px 8px}
.sx-mrow button{border:0;background:#f6d5db;color:#7d1f30;border-radius:6px;height:24px}
.sx-missed small{color:#9b4a58}
.sx-countbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.sx-countbtns{display:flex;gap:6px}
.sx-target-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.sx-target-grid .btn{min-height:48px;font-size:18px;font-weight:800}
@media(min-width:700px){.sx-row{grid-template-columns:50px 1fr 1fr 60px minmax(0,1fr) 34px}.sx-row .sx-col{grid-column:5;grid-row:1}.sx-row .sx-x{grid-column:6;grid-row:1}}

		throw new Error(num.length + "/" + shift);

		offset++;

	for (var i = 0; i < num.length - offset; i++) {

	}

		return this.num[index];

		return this.num.length;
	},

		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

		return new QRPolynomial(num, 0);

			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );

		}

async function ensureSession(forceToday=false){
 if(sessionPreparation)return sessionPreparation;
 const current=SC.session(S);
 if(!forceToday&&current&&!current.closedAt&&(current.date===TRP.day()||sessionChoiceExplicit))return current;
 sessionPreparation=(async()=>{
  const result=await commit(s=>SC.todaySession(s));sessionChoiceExplicit=false;
  identityChecked=false;render();return result;
 })();
 try{return await sessionPreparation;}finally{sessionPreparation=null;}
}
async function selectAttendanceSession(id,{reopen=false}={}){
 if(saving||ingesting)throw new Error('Wait for the current save.');
 const target=SC.session(S,id);if(!target){render();return false;}
 if(target.closedAt&&!reopen&&!confirm('This session is closed. Reopen '+target.label+'? Earlier receipts keep their original date and ID. New receipts use '+target.date+'.')){render();return false;}
 const old=SC.session(S),hasDraft=unfinishedCapture();
 if(hasDraft&&old?.date!==target.date&&!confirm('Keep this user and PC, and use '+target.date+' as the actual date for this unfinished record? Earlier saved receipts will not move.')){render();return false;}
 if(target.date!==TRP.day()&&!hasDraft&&!confirm('Use '+target.date+' as the actual date, not today? Only new records use this date.')){render();return false;}
 await commit(s=>{const x=SC.session(s,id);if(!x)throw new Error('Session not found.');if(x.closedAt){x.closedAt='';SC.event(s,'session-reopened',{sessionId:id});}s.activeSessionId=id;SC.event(s,'session-selected',{sessionId:id});});
 if(receipt)resetCapture(false);else {captureEpoch++;identityChecked=false;if(old?.date!==target.date)shipmentDraft.reviewed=false;}
 sessionChoiceExplicit=true;if(!userMode())workflow='delivery';closeModal();render();
 toast('Session: '+target.label+(hasDraft?' · unfinished user / PC kept.':''));return true;
}
async function createAttendanceSession(label,date,part){
 if(saving||ingesting)throw new Error('Wait for the current save.');
 const old=SC.session(S),hasDraft=unfinishedCapture();
 if(hasDraft&&old?.date!==date&&!confirm('Keep the unfinished user / PC and record it on '+date+'? Nothing already saved will be moved.'))return null;

}

function dailyAttendancePeople(date){
 const d=date||TRP.day(),sessionByRecord=new Map();
 for(const b of S.sessions||[])for(const rid of b.recordIds||[])sessionByRecord.set(rid,b);
 const groups=new Map();
 for(const t of S.transactions||[]){
  if(!t?.user||t.shipment||t.date!==d)continue;
  const key=t.user.taskId||SC.norm(t.user.mudid)||[SC.norm(t.user.name),SC.norm(t.user.asset),SC.norm(t.user.serial)].join('|');
  if(!groups.has(key))groups.set(key,{key,user:t.user,records:[],sessions:new Map(),firstAt:t.recordedAt||'',lastAt:t.recordedAt||'',engineers:new Set()});
  const g=groups.get(key);g.records.push(t);if(t.recordedAt&&(!g.firstAt||t.recordedAt<g.firstAt))g.firstAt=t.recordedAt;if(t.recordedAt&&(!g.lastAt||t.recordedAt>g.lastAt))g.lastAt=t.recordedAt;if(t.engineer)g.engineers.add(t.engineer);
  const b=sessionByRecord.get(t.id);if(b)g.sessions.set(b.id,b.label);
 }
 return [...groups.values()].sort((a,b)=>(a.firstAt||'').localeCompare(b.firstAt||'')||(a.user.name||a.user.mudid||'').localeCompare(b.user.name||b.user.mudid||''));
}

function findManualUser(name,mudid){

 const m=SC.norm(mudid),n=String(name||'').trim().toLowerCase();let matches=[];
 if(m)matches=rows.filter(r=>SC.norm(r.mudid)===m);
 else if(n){const exact=rows.filter(r=>String(r.user||'').trim().toLowerCase()===n);matches=exact.length?exact:rows.filter(r=>String(r.user||'').toLowerCase().includes(n));}
 else throw new Error('Enter the MUDID or user name.');
 if(!matches.length)throw new Error('User not found in the imported Admin reference. Update the reference or use the normal Admin / Operational workflow first.');
 if(matches.length>1)throw new Error('More than one user matches. Enter the exact MUDID.');
 const r=matches[0];if(m&&n&&String(r.user||'').trim().toLowerCase()!==n)throw new Error('That MUDID belongs to '+(r.user||r.mudid)+'. Correct the typed name or leave Name blank.');
 if(r.skipped)throw new Error('This task is excluded in Admin.');if(workflow==='delivery'&&r.delivered)throw new Error('Admin reference already marks this user delivered. Refresh the reference or review the existing handover.');

function sxInfo(c){const t=codeString(c),k=LabelCore.classify(t);const kind=k.kind==='combined'?'serial':k.kind;const value=k.kind==='combined'?k.serial:k.value;return {c,t,kind,value,part:k.kind==='combined'?k.part:k.kind==='part'?k.value:'',warr:k.kind==='warranty'?k.warr:'',geo:Number.isFinite(c?.cx),cx:c?.cx,cy:c?.cy};}

   const byValue=(list,f)=>{const m=new Map();for(const x of list){const v=f(x);if(!m.has(v)||d(x,anchor)<d(m.get(v),anchor))m.set(v,x);}return [...m.values()];};
   const out=[];

 }

 const gaps=[];{const by=new Map();for(const r of list){const m=/^(\d{2}L)(\d{5})$/.exec(r.asset||'');if(m){if(!by.has(m[1]))by.set(m[1],[]);by.get(m[1]).push(+m[2]);}}
  const reg=new Set(sets.all.map(r=>r.asset));for(const [p,nums] of by){nums.sort((a,b)=>a-b);for(let i=1;i<nums.length;i++){const diff=nums[i]-nums[i-1];if(diff>1&&diff<=6)for(let n=nums[i-1]+1;n<nums[i];n++){const a=p+String(n).padStart(5,'0');if(!reg.has(a))gaps.push(a);}}}}
 $('sxGaps').hidden=!gaps.length||list.length<3;$('sxGaps').innerHTML=gaps.length?`<b>Possible skipped box${gaps.length>1?'es':''}:</b> <span class="mono">${gaps.slice(0,12).map(esc).join(', ')}</span>${gaps.length>12?' …':''}<small>Asset numbers missing between consecutive scans. Ignore if those tags were never in this delivery.</small>`:'';
 const rows=list.map((r,i)=>({r,seq:i+1})).reverse().filter(x=>!q||[x.r.asset,x.r.serial,x.r.part].some(v=>String(v||'').toUpperCase().includes(q)));
 const shown=SX.showAll?rows:rows.slice(0,40);
 $('sxList').innerHTML=shown.map(({r,seq})=>SX.confirmDel===r.id?`<div class="sx-row confirm"><span class="sx-seq">#${seq}</span><span class="sx-confirm-text">Delete <b class="mono">${esc(r.asset)}</b>? It will not be counted.</span><span class="sx-confirm-btns"><button type="button" class="btn small danger" data-sx="del-yes">Delete</button><button type="button" class="btn small" data-sx="del-no">Keep</button></span></div>`:`<div class="sx-row ${r.id===SX.lastSavedId?'new':''}"><span class="sx-seq">#${seq}</span><span class="mono sx-asset">${esc(r.asset)}</span><span class="mono sx-serial">${esc(r.serial)}</span><span class="sx-when">${r.scannedAt?esc(sxJstDay(r.scannedAt)===sxJstDay()?sxTime(r.scannedAt).slice(0,5):sxJstDay(r.scannedAt).slice(5)):''}</span><button type="button" class="sx-x" data-sx="del" data-id="${esc(r.id)}" aria-label="Delete ${esc(r.asset)}" title="Delete this scan">✕</button><span class="sx-col">${esc(SC.column(S,r.boxId)?.label||r.box||'')}</span></div>`).join('')||`<div class="sx-empty">${q?'No match in this list.':'Nothing scanned yet in this view.'}</div>`;
 $('sxMore').hidden=SX.showAll||rows.length<=40;$('sxMore').textContent='Show all '+rows.length;
 $('sxPairMode').textContent=sxLayout()==='same'?'asset + serial on ONE label (box switch protection on)':'separate stickers (asks “Same box?”)';
}
function sxCopy(){
 const list=sxList(sxSets(),SX.tab);
 const text=['#\tAsset\tSerial\tPart\tColumn\tScanned (JST)',...list.map((r,i)=>[i+1,r.asset,r.serial,r.part||'',SC.column(S,r.boxId)?.label||r.box||'',r.scannedAt?sxJstDay(r.scannedAt)+' '+sxTime(r.scannedAt):''].join('\t'))].join('\n');
 (navigator.clipboard?.writeText(text)||Promise.reject()).then(()=>toast(list.length+' row(s) copied · paste into Excel')).catch(()=>modal('Copy list',`<textarea rows="12" readonly>${esc(text)}</textarea>`));
}
function sxAskDelete(id){
 const chk=ManagementCore.inspect(S,'stock',id);
 if(!chk.ok){SX.confirmDel='';toast('Cannot delete '+chk.label+': '+chk.reason,true);sxRenderPanel(true);return;}
 SX.confirmDel=id;sxRenderPanel(true);sxRenderAlerts();
}
async function sxDelete(){
 const id=SX.confirmDel;if(!id)return;if(saving||ingesting)throw new Error('Wait for the current save.');
 const r=S.records.find(x=>x.id===id);
 await commit(s=>ManagementCore.remove(s,'stock',[id],{reason:'Wrong stock scan deleted from the scanned list',confirmed:true}));
 if(lastStock?.id===id){lastStock=null;if(completionVisible)resetCapture(true);}
 if(SX.lastSavedId===id)SX.lastSavedId='';
 SX.confirmDel='';SX.sig='';render();toast('Deleted '+(r?.asset||'scan')+' · read that box again');sxHint('Deleted '+(r?.asset||'')+' · read the box again');
}
function sxTargetModal(){
 const t=+sxPref().target||0;
 modal('Counter target',`<p class="small muted">Shows progress like 7/20 on the camera, a sound at the target and an orange warning above it. Applies to the counter currently shown (${sxModeLabel(sxMode())}).</p><div class="sx-target-grid">${[10,14,16,20,24,30].map(n=>`<button type="button" class="btn ${n===t?'primary':''}" data-sx="target-set" data-n="${n}">${n}</button>`).join('')}</div><div class="row" style="gap:8px;margin-top:10px;align-items:center"><input id="sxTargetInput" type="number" min="1" max="999" placeholder="Other" style="flex:1" value="${t&&![10,14,16,20,24,30].includes(t)?t:''}"><button type="button" class="btn" data-sx="target-custom">Set</button></div>`,`<button type="button" class="btn" data-sx="target-set" data-n="0">No target</button><button type="button" class="btn" data-action="close-modal">Close</button>`);
}

/* ---------- hooks ---------- */
const sxBaseReset=resetCapture;
resetCapture=function(...args){SX.pairs.clear();SX.pending=null;SX.approved='';SX.blockDeadline=0;SX.autoPaused=false;SX.seen.clear();SX.seenN.clear();return sxBaseReset.apply(this,args);};
const sxBaseRenderCapture=renderCapture;
renderCapture=function(...args){
 const out=sxBaseRenderCapture.apply(this,args);
 try{
  if(!sxEnsure())return out;
  if(workflow==='stock'){
   if($('captureTools')&&analysis().blocked&&!receipt&&!completionVisible)$('captureTools').hidden=false;
   if(completionVisible&&lastStock&&lastStock.id!==SX.lastSavedId){
    SX.lastSavedId=lastStock.id;SX.lastSavedAt=Date.now();SX.okUntil=Date.now()+900;
    const list=sxList(sxSets(),sxMode()),target=+sxPref().target||0;
    if(target&&list.length===target){sxBeep('goal');sxFlash('good',`<strong>✓ ${list.length}/${target} complete</strong><small>${esc(sxModeLabel(sxMode()))} reached the target · tap 0↺ for the next one</small>`,3000);}
    else if(target&&list.length>target){sxBeep('dup');sxFlash('warn',`<strong>⚠ ${list.length}/${target}</strong><small>More boxes than the target · check this column</small>`,3000);}
    else sxBeep('ok');
   }
   if(completionVisible&&lastStock){const list=sxList(sxSets(),sxMode()),seq=sxSeq(lastStock,list),t=+sxPref().target||0;const cc=$('cameraComplete');if(cc)cc.innerHTML=`<strong>✓ #${seq||'–'}${t?' / '+t:''} saved</strong><span class="mono">${esc(lastStock.asset)} · ${esc(lastStock.serial)}</span>`;}
  }
  sxRenderHud();sxRenderAlerts();sxRenderPanel();
 }catch(e){console.warn('stock assist',e);}
 return out;
};
const sxBaseRender=render;
render=function(...args){const out=sxBaseRender.apply(this,args);try{if(sxEnsure()){sxRenderHud();sxRenderAlerts();sxRenderPanel(true);}}catch(e){console.warn('stock assist',e);}return out;};
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-sx]');if(!b)return;e.preventDefault();e.stopPropagation();
 try{
  switch(b.dataset.sx){
   case 'rescan':sxRescan(false);break;
   case 'details':SX.autoPaused=true;sxRenderAlerts();modal('Why this label was not accepted',`<div class="notice bad">${esc(analysis().message||'')}</div><p class="small muted">Nothing has been saved for this reading. Auto-reset is paused while you check.</p>`,`<button type="button" class="btn primary" data-sx="rescan-close">↻ Read again</button>`);break;
   case 'rescan-close':closeModal();sxRescan(false);break;
   case 'pair-save':{if(!SX.pending)break;SX.approved=SX.pending.key;const src=SX.pending.source||'camera';SX.pending=null;await acceptBatch([],src==='photo'?'photo':'camera');render();break;}
   case 'pair-toggle':{const next=sxLayout()==='same'?'apart':'same';sxSetPref({layout:next,pairCheck:next==='apart'?'off':'on'});SX.sig='';sxRenderPanel(true);toast(next==='same'?'One label: boxes are never combined across a box switch.':'Separate stickers: fields combine across frames; you confirm “Same box?”.');break;}
   case 'tab':SX.tab=b.dataset.tab;SX.showAll=false;SX.confirmDel='';sxRenderPanel(true);break;
   case 'more':SX.showAll=true;sxRenderPanel(true);break;
   case 'copy':sxCopy();break;
   case 'mode':{const order=['count','column','day'],next=order[(order.indexOf(sxMode())+1)%3];sxSetPref({mode:next});SX.tab=next;SX.sig='';sxRenderHud();sxRenderPanel(true);sxHint('Counter: '+sxModeLabel(next));break;}
   case 'zero':SX.undoStart=sxCountStart();SX.undoUntil=Date.now()+8000;sxSetPref({countStart:new Date().toISOString(),mode:'count'});SX.tab='count';SX.sig='';sxRenderHud();sxRenderPanel(true);sxHint('Count restarted at 0');break;
   case 'zero-undo':sxSetPref({countStart:SX.undoStart||''});SX.undoStart=null;SX.undoUntil=0;SX.sig='';sxRenderHud();sxRenderPanel(true);sxHint('Count restored');break;
   case 'target':sxTargetModal();break;
   case 'target-set':sxSetPref({target:+b.dataset.n||0});closeModal();SX.sig='';sxRenderHud();sxRenderPanel(true);break;
   case 'target-custom':{const n=Math.round(+$('sxTargetInput').value);if(!(n>=1&&n<=999))throw new Error('Enter a target between 1 and 999.');sxSetPref({target:n});closeModal();SX.sig='';sxRenderHud();sxRenderPanel(true);break;}
   case 'del':sxAskDelete(b.dataset.id);break;
   case 'del-last':if(SX.lastSavedId)sxAskDelete(SX.lastSavedId);break;
   case 'del-yes':await sxDelete();break;
   case 'del-no':SX.confirmDel='';sxRenderPanel(true);sxRenderAlerts();break;
   case 'miss-x':sxSetPref({missed:(sxPref().missed||[]).filter(m=>(m.asset||m.serial)!==b.dataset.k)});SX.sig='';sxRenderPanel(true);break;
  }
 }catch(err){error(err);}
},true);
document.addEventListener('input',e=>{if(e.target.id==='sxSearch'){SX.query=e.target.value;sxRenderPanel(true);}});
setInterval(()=>{if(workflow==='stock'&&$('sxHud')&&!$('sxHud').hidden){sxRenderHud();$('camera')?.classList.toggle('sx-ok',SX.okUntil>Date.now());}},500);

initial();window.SN.ready=load();
</script></body></html>
